name: rustore-dependency-guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject deprecated BillingClient and old RuStore repositories
        shell: bash
        run: |
          set -euo pipefail
          # ProductionReleaseValidator intentionally contains the forbidden token as a runtime scan rule,
          # so exclude that one source file from this text-level CI check to avoid self-matching.
          if grep -RInE 'billingclient|artifactory-external\.vkpartner\.ru|nexus-external\.vkteam\.ru' UnityProject \
              --exclude-dir=Library \
              --exclude=ProductionReleaseValidator.cs; then
            echo 'Deprecated RuStore dependency/reference found.'
            exit 1
          fi
          grep -q 'UnityPlayerActivity' docs/RUSTORE_RELEASE_CHECKLIST.md
          grep -q '11.1.0' UnityProject/Assets/Game/Platform/RuStore/RuStoreSdkVersions.cs
          grep -q '"com.unity.modules.audio": "1.0.0"' UnityProject/Packages/manifest.json
          grep -q '"com.unity.modules.imageconversion": "1.0.0"' UnityProject/Packages/manifest.json
          grep -q '"ru.rustore.core": "10.5.0"' UnityProject/Packages/manifest.json
          grep -q '"ru.rustore.pay": "11.1.0"' UnityProject/Packages/manifest.json
          grep -q '"ru.rustore.update": "10.5.1"' UnityProject/Packages/manifest.json
          grep -q '"ru.rustore.review": "10.5.1"' UnityProject/Packages/manifest.json
          grep -q 'nexus-external.rustore.ru/repository/npm-unity-rustore-exposed' UnityProject/Packages/manifest.json

          # Install Referrer and Remote Config are optional during Editor functional testing.
          # Their adapters must remain SDK-isolated so the game compiles and falls back safely when
          # the official Android integration packages are not installed yet.
          grep -q 'FindRuStoreType("InstallReferrerClient")' UnityProject/Assets/Game/Platform/RuStore/RuStoreInstallReferrerService.cs
          grep -q 'FindRuStoreType("RuStoreRemoteConfigClient")' UnityProject/Assets/Game/Platform/RuStore/RuStoreRemoteConfigService.cs
