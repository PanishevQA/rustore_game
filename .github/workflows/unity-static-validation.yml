name: unity-static-validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Unity project structure and release-critical pins
        run: python scripts/validate_unity_project.py
      - name: Validate RuStore SDK verified baseline
        run: python scripts/validate_rustore_sdk_baseline.py
      - name: Validate RuStore Pay release contract
        run: python scripts/validate_rustore_pay_release.py
      - name: Validate referral and Install Referrer release contract
        run: python scripts/validate_referral_release.py
      - name: Validate Android editor and release configuration
        run: python scripts/validate_editor_android_config.py
      - name: Validate release build observability
        run: python scripts/validate_build_observability.py
      - name: Validate Android production build entrypoint
        run: python scripts/validate_android_release_build_entrypoint.py
      - name: Validate Remote Config build identity
        run: python scripts/validate_remote_config_build_identity.py
      - name: Validate Remote Config version policy
        run: python scripts/validate_remote_config_version_policy.py
      - name: Validate Remote Config cache recovery
        run: python scripts/validate_remote_config_cache_recovery.py
      - name: Validate release placeholder contract
        run: python scripts/validate_release_placeholders.py
      - name: Validate async navigation invariants
        run: python scripts/validate_async_navigation.py
      - name: Validate platform and store async invariants
        run: python scripts/validate_platform_async.py
      - name: Guard shared GameBootstrap runtime contract
        shell: bash
        run: |
          set -euo pipefail
          bridge='UnityProject/Assets/Game/Presentation/GameBootstrapRuntimeBridge.cs'
          mobile='UnityProject/Assets/Game/Presentation/MobileUiCoordinator.cs'
          ads='UnityProject/Assets/Game/Presentation/AdRuntimeCoordinator.cs'
          rewarded='UnityProject/Assets/Game/Presentation/RewardedHomeOverlay.cs'
          platform='UnityProject/Assets/Game/Presentation/RuntimePlatformCoordinator.cs'
          meta='UnityProject/Assets/Game/Presentation/MetaMenuOverlay.cs'

          test -f "$bridge"
          grep -q 'public static bool IsIdleHome' "$bridge"
          grep -q 'public static bool IsResult' "$bridge"

          grep -q 'GameBootstrapRuntimeBridge.IsHome' "$mobile"
          grep -q 'GameBootstrapRuntimeBridge.IsActiveRound' "$mobile"
          grep -q 'GameBootstrapRuntimeBridge.IsTutorial' "$mobile"
          grep -q 'GameBootstrapRuntimeBridge.AbortToHome' "$mobile"
          grep -q 'GameBootstrapRuntimeBridge.RestartTutorial' "$mobile"
          grep -q 'GameBootstrapRuntimeBridge.IsIdleHome' "$ads"
          grep -q 'GameBootstrapRuntimeBridge.IsResult' "$ads"
          grep -q 'GameBootstrapRuntimeBridge.IsIdleHome' "$rewarded"
          grep -q 'GameBootstrapRuntimeBridge.IsIdleHome' "$platform"
          grep -q 'GameBootstrapRuntimeBridge.IsHome' "$meta"

          for file in "$mobile" "$ads" "$rewarded" "$platform" "$meta"; do
            if grep -nE 'System\.Reflection|BindingFlags|GetField\(|GetMethod\(' "$file"; then
              echo "Private GameBootstrap reflection leaked outside GameBootstrapRuntimeBridge: $file"
              exit 1
            fi
          done

          grep -q 'BindingFlags.Instance | BindingFlags.NonPublic' "$bridge"
          grep -q 'ReportMissingContractIfNeeded' "$bridge"
