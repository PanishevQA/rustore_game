name: offline-mode-guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline-first runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/Assets/Game/Social/OfflineGameApi.cs
          test -f UnityProject/Assets/Game/Platform/RuStore/RuStoreRemoteConfigService.cs
          test -f UnityProject/Assets/Game/Presentation/RemoteGameplayTuningCoordinator.cs
          grep -q 'OptionalBackendBaseUrl = ""' UnityProject/Assets/Game/Presentation/GameRuntimeSettings.cs
          grep -q 'OfflineGameApi' UnityProject/Assets/Game/Network/UnityGameApi.cs
          grep -q 'SeedForDate' UnityProject/Assets/Game/Social/OfflineGameApi.cs
          grep -q 'BuildInstallUrl' UnityProject/Assets/Game/Social/OfflineGameApi.cs
          grep -q 'private const string Prefix = "L2"' UnityProject/Assets/Game/Social/OfflineGameApi.cs
          grep -q 'routeCount' UnityProject/Assets/Game/Social/OfflineGameApi.cs
          grep -q 'RuStoreRemoteConfigService' UnityProject/Assets/Game/Network/BootstrapRemoteConfigService.cs
          grep -q 'RuStoreRemoteConfigClient' UnityProject/Assets/Game/Platform/RuStore/RuStoreRemoteConfigService.cs
          grep -q 'daily_route_count' UnityProject/Assets/Game/Presentation/RemoteGameplayTuningCoordinator.cs
          grep -q 'RouteCount' UnityProject/Assets/Game/Presentation/GameBootstrap.cs

          # Runtime config must not fetch our own /config/bootstrap endpoint in release code.
          if grep -nE 'UnityWebRequest|/config/bootstrap' UnityProject/Assets/Game/Network/BootstrapRemoteConfigService.cs; then
            echo 'Developer-operated bootstrap config HTTP dependency detected.'
            exit 1
          fi

          # Local release UI must not promise background server synchronization.
          if grep -nE 'FlushPendingAttempts|Синхронизац|отправим позже|Ожидает синхронизации' \
              UnityProject/Assets/Game/Presentation/GameBootstrap.cs; then
            echo 'Legacy server-sync UX detected in offline-first GameBootstrap.'
            exit 1
          fi

          # The production store must work without the optional developer backend.
          if grep -nE 'UnityGameApi|DontGetSidetracked\.Network' UnityProject/Assets/Game/Presentation/MetaMenuOverlay.cs; then
            echo 'Store UI is wired to developer backend/network code.'
            exit 1
          fi
          grep -q 'RUSTORE_CONFIRMED_OWNERSHIP' UnityProject/Assets/Game/Economy/StoreService.cs
          grep -q 'RUSTORE_PURCHASE_RESULT' UnityProject/Assets/Game/Economy/StoreService.cs

          # Reject concrete release wiring to a mandatory developer backend. Do not match prose such as
          # "no backend is required", because that would be a self-defeating false positive.
          if grep -RInE 'ProductionBackendBaseUrl|configure the deployed HTTPS backend|REQUIRED_BACKEND_URL' \
              UnityProject/Assets/Game docs README.md \
              --exclude=UnityGameApi.cs \
              --exclude=BootstrapRemoteConfigService.cs; then
            echo 'Mandatory developer-backend configuration detected.'
            exit 1
          fi

          if grep -RInE 'https?://(localhost|127\.0\.0\.1)' UnityProject/Assets/Game; then
            echo 'Local developer HTTP endpoint leaked into runtime.'
            exit 1
          fi
