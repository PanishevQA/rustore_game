name: unity-self-hosted

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'AGENTS.md'
      - 'UnityProject/**'
      - 'scripts/**'
      - '.github/workflows/unity-self-hosted.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent validation mode'
        required: true
        default: 'Unity'
        type: choice
        options:
          - Unity
          - Full
          - Build
          - ReleaseCandidate
          - DeviceSmokeApk
          - AndroidIntegrationProbe

permissions:
  contents: read

concurrency:
  group: unity-self-hosted-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity batchmode gate
    if: ${{ vars.UNITY_SELF_HOSTED_ENABLED == 'true' && github.repository == 'PanishevQA/rustore_game' }}
    runs-on: [self-hosted, windows, x64, unity]
    timeout-minutes: 60
    env:
      UNITY_EXE: ${{ vars.UNITY_EXE }}
      # Trusted push branches can request a release action by prefix; all other agent/** pushes run Full.
      # workflow_dispatch remains available for explicit manual mode selection.
      AGENT_CHECK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || startsWith(github.ref_name, 'agent/release-candidate/') && 'ReleaseCandidate' || startsWith(github.ref_name, 'agent/build/') && 'Build' || startsWith(github.ref_name, 'agent/device-smoke/') && 'DeviceSmokeApk' || startsWith(github.ref_name, 'agent/android-probe/') && 'AndroidIntegrationProbe' || 'Full' }}

    steps:
      - name: Checkout trusted agent branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Clean stale release artifacts
        shell: powershell
        run: |
          foreach ($path in @("artifacts/agent-check", "artifacts/release-candidate", "artifacts/android-integration-probe", "artifacts/device-smoke")) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

      - name: Bootstrap portable Python
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap_portable_python.ps1

      - name: Verify Unity runner environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_unity_runner_environment.ps1

      - name: Run Unity agent gate
        if: ${{ env.AGENT_CHECK_MODE != 'AndroidIntegrationProbe' && env.AGENT_CHECK_MODE != 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\agent_check.ps1 -Mode $env:AGENT_CHECK_MODE -SkipFast

      - name: Build signed device-smoke APK
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_release_candidate_checks.ps1 -BuildSmokeApk

      - name: Install polished texture-skin APK and capture Drawing + Result
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install_signed_device_smoke_apk.ps1

          $adbExe = "C:\Program Files\Unity\Hub\Editor\6000.3.24f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe"
          if (-not (Test-Path $adbExe)) { throw "adb not found: $adbExe" }
          $serial = ((& $adbExe devices) | Where-Object { $_ -match "^([^\s]+)\s+device\s*$" } | ForEach-Object { $Matches[1] } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($serial)) { throw "No authorized Android device found." }

          $package = "ru.release.nesbeisya"
          $out = Join-Path $PWD "artifacts\device-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Shot([string]$Name) {
            $remote = "/sdcard/nesbeisya-$Name.png"
            $local = Join-Path $out "$Name.png"
            & $adbExe -s $serial shell screencap -p $remote
            & $adbExe -s $serial pull $remote $local | Out-Host
            & $adbExe -s $serial shell rm $remote | Out-Null
            return $local
          }

          & $adbExe -s $serial shell am force-stop $package | Out-Null
          & $adbExe -s $serial shell monkey -p $package -c android.intent.category.LAUNCHER 1 | Out-Host
          Start-Sleep -Seconds 7

          # Home -> Training -> Start.
          & $adbExe -s $serial shell input tap 540 1510
          Start-Sleep -Seconds 2
          & $adbExe -s $serial shell input tap 540 2050
          Start-Sleep -Seconds 5
          $drawPath = Shot "01-drawing-polished"

          # Detect actual start/end rings and finish one gesture.
          $bmp = [System.Drawing.Bitmap]::FromFile($drawPath)
          try {
            $cyan = New-Object System.Collections.Generic.List[System.Drawing.Point]
            $light = New-Object System.Collections.Generic.List[System.Drawing.Point]
            for ($y = 650; $y -lt 1850; $y += 2) {
              for ($x = 70; $x -lt 1010; $x += 2) {
                $px = $bmp.GetPixel($x, $y)
                if ($px.R -lt 120 -and $px.G -gt 150 -and $px.B -gt 170) { $cyan.Add([System.Drawing.Point]::new($x,$y)) }
                if ($px.R -gt 205 -and $px.G -gt 205 -and $px.B -gt 205) { $light.Add([System.Drawing.Point]::new($x,$y)) }
              }
            }
            if ($cyan.Count -eq 0 -or $light.Count -eq 0) { throw "Could not detect gameplay markers." }
            $startX = [int](($cyan | Measure-Object -Property X -Average).Average)
            $startY = [int](($cyan | Measure-Object -Property Y -Average).Average)
            $far = @($light | Where-Object {
              $dx = $_.X - $startX
              $dy = $_.Y - $startY
              ($dx*$dx + $dy*$dy) -gt 30000
            })
            if ($far.Count -eq 0) { throw "Could not isolate finish marker." }
            $endX = [int](($far | Measure-Object -Property X -Average).Average)
            $endY = [int](($far | Measure-Object -Property Y -Average).Average)
          }
          finally { $bmp.Dispose() }

          & $adbExe -s $serial shell input swipe $startX $startY $endX $endY 1250
          Start-Sleep -Seconds 4
          Shot "02-result-polished"

          $appPid = ((& $adbExe -s $serial shell pidof $package) | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($appPid)) { throw "App process died during polished texture-skin smoke." }

          @(
            "TextureSkinPolishDeviceSmoke=PASS",
            "Serial=$serial",
            "Pid=$appPid",
            "SourceSha=adfe58852e0b4e08013ee2276a8a9cfa66d3a2cc"
          ) | Set-Content -Path (Join-Path $out "polish-report.txt") -Encoding UTF8

      - name: Run Android integration and native AAR probe
        if: ${{ env.AGENT_CHECK_MODE == 'AndroidIntegrationProbe' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_android_integration_probe.ps1 -TimeoutSeconds 2400

      - name: Upload Unity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/agent-check/**
            artifacts/release-candidate/**
            artifacts/android-integration-probe/**
            artifacts/device-smoke/**
