name: unity-self-hosted

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'AGENTS.md'
      - 'UnityProject/**'
      - 'scripts/**'
      - '.github/workflows/unity-self-hosted.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent validation mode'
        required: true
        default: 'Unity'
        type: choice
        options:
          - Unity
          - Full
          - Build
          - ReleaseCandidate
          - DeviceSmokeApk
          - AndroidIntegrationProbe

permissions:
  contents: read

concurrency:
  group: unity-self-hosted-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity batchmode gate
    if: ${{ vars.UNITY_SELF_HOSTED_ENABLED == 'true' && github.repository == 'PanishevQA/rustore_game' }}
    runs-on: [self-hosted, windows, x64, unity]
    timeout-minutes: 60
    env:
      UNITY_EXE: ${{ vars.UNITY_EXE }}
      # Trusted push branches can request a release action by prefix; all other agent/** pushes run Full.
      # workflow_dispatch remains available for explicit manual mode selection.
      AGENT_CHECK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || startsWith(github.ref_name, 'agent/release-candidate/') && 'ReleaseCandidate' || startsWith(github.ref_name, 'agent/build/') && 'Build' || startsWith(github.ref_name, 'agent/device-smoke/') && 'DeviceSmokeApk' || startsWith(github.ref_name, 'agent/android-probe/') && 'AndroidIntegrationProbe' || 'Full' }}

    steps:
      - name: Checkout trusted agent branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Clean stale release artifacts
        shell: powershell
        run: |
          foreach ($path in @("artifacts/agent-check", "artifacts/release-candidate", "artifacts/android-integration-probe")) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

      - name: Bootstrap portable Python
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap_portable_python.ps1

      - name: Verify Unity runner environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_unity_runner_environment.ps1

      - name: Run Unity agent gate
        if: ${{ env.AGENT_CHECK_MODE != 'AndroidIntegrationProbe' && env.AGENT_CHECK_MODE != 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\agent_check.ps1 -Mode $env:AGENT_CHECK_MODE -SkipFast

      - name: Build signed device-smoke APK
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_release_candidate_checks.ps1 -BuildSmokeApk

      - name: Install signed device-smoke APK
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install_signed_device_smoke_apk.ps1

      - name: Capture gameplay after hint layout fix
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $adbExe = "C:\Program Files\Unity\Hub\Editor\6000.3.24f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe"
          if (-not (Test-Path $adbExe)) { throw "adb not found: $adbExe" }
          $devices = @()
          foreach ($line in (& $adbExe devices)) {
            if ($line -match "^([^\s]+)\s+device\s*$") { $devices += $Matches[1] }
          }
          if ($devices.Count -ne 1) { throw "Expected exactly one authorized Android device; found $($devices.Count)." }
          $serial = $devices[0]
          $package = "ru.release.nesbeisya"
          $out = Join-Path $PWD "artifacts\gameplay-hint-capture"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Shot([string]$Name) {
            $remote = "/sdcard/nesbeisya-$Name.png"
            $local = Join-Path $out "$Name.png"
            & $adbExe -s $serial shell screencap -p $remote
            & $adbExe -s $serial pull $remote $local | Out-Host
            & $adbExe -s $serial shell rm $remote | Out-Null
          }

          & $adbExe -s $serial shell input keyevent KEYCODE_WAKEUP | Out-Null
          & $adbExe -s $serial shell wm dismiss-keyguard | Out-Null
          & $adbExe -s $serial shell am force-stop $package | Out-Null
          & $adbExe -s $serial shell monkey -p $package -c android.intent.category.LAUNCHER 1 | Out-Host
          Start-Sleep -Seconds 6

          & $adbExe -s $serial shell input tap 540 1840
          Start-Sleep -Seconds 2
          Shot "01-training-menu"

          & $adbExe -s $serial shell input tap 540 2045
          Start-Sleep -Milliseconds 900
          Shot "02-route-preview"

          Start-Sleep -Seconds 5
          Shot "03-draw-phase"

          # Physical capture above establishes the Easy route markers around these
          # coordinates on the 1080x2400 device: cyan start at bottom, white end at top.
          & $adbExe -s $serial shell input swipe 520 1790 507 980 1200
          Start-Sleep -Seconds 3
          Shot "04-result"

          $appPid = ((& $adbExe -s $serial shell pidof $package) | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($appPid)) { throw "App process died during gameplay capture." }

          @(
            "GameplayHintCapture=PASS",
            "Serial=$serial",
            "Gesture=520,1790 -> 507,980",
            "Pid=$appPid"
          ) | Set-Content -Path (Join-Path $out "report.txt") -Encoding UTF8

      - name: Run Android integration and native AAR probe
        if: ${{ env.AGENT_CHECK_MODE == 'AndroidIntegrationProbe' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_android_integration_probe.ps1 -TimeoutSeconds 2400

      - name: Upload Unity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/agent-check/**
            artifacts/release-candidate/**
            artifacts/android-integration-probe/**
            artifacts/device-smoke/**
            artifacts/gameplay-hint-capture/**
