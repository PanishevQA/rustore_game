name: unity-self-hosted

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'AGENTS.md'
      - 'UnityProject/**'
      - 'scripts/**'
      - '.github/workflows/unity-self-hosted.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent validation mode'
        required: true
        default: 'Unity'
        type: choice
        options:
          - Unity
          - Full
          - Build

permissions:
  contents: read

concurrency:
  group: rustore-release-tarball-probe-${{ github.repository }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity batchmode gate
    if: ${{ vars.UNITY_SELF_HOSTED_ENABLED == 'true' && github.repository == 'PanishevQA/rustore_game' }}
    runs-on: [self-hosted, windows, x64, unity]
    timeout-minutes: 20
    env:
      UNITY_EXE: ${{ vars.UNITY_EXE }}
      AGENT_CHECK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'Unity' }}

    steps:
      - name: Checkout trusted agent branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap portable Python
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap_portable_python.ps1

      - name: Verify Unity runner environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_unity_runner_environment.ps1

      - name: Inspect official RuStore release tarballs
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\probe_rustore_release_tarballs.ps1

      - name: Upload Unity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/agent-check/**
            artifacts/release-candidate/**
            artifacts/rustore-release-artifact-probe/**
