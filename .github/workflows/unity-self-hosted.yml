name: unity-self-hosted

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'AGENTS.md'
      - 'UnityProject/**'
      - 'scripts/**'
      - '.github/workflows/unity-self-hosted.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent validation mode'
        required: true
        default: 'Unity'
        type: choice
        options:
          - Unity
          - Full
          - Build
          - ReleaseCandidate
          - DeviceSmokeApk
          - AndroidIntegrationProbe

permissions:
  contents: read

concurrency:
  group: unity-self-hosted-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity batchmode gate
    if: ${{ vars.UNITY_SELF_HOSTED_ENABLED == 'true' && github.repository == 'PanishevQA/rustore_game' }}
    runs-on: [self-hosted, windows, x64, unity]
    timeout-minutes: 60
    env:
      UNITY_EXE: ${{ vars.UNITY_EXE }}
      # Trusted push branches can request a release action by prefix; all other agent/** pushes run Full.
      # workflow_dispatch remains available for explicit manual mode selection.
      AGENT_CHECK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || startsWith(github.ref_name, 'agent/release-candidate/') && 'ReleaseCandidate' || startsWith(github.ref_name, 'agent/build/') && 'Build' || startsWith(github.ref_name, 'agent/device-smoke/') && 'DeviceSmokeApk' || startsWith(github.ref_name, 'agent/android-probe/') && 'AndroidIntegrationProbe' || startsWith(github.ref_name, 'agent/device-capture/') && 'DeviceCapture' || 'Full' }}

    steps:
      - name: Checkout trusted agent branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Clean stale release artifacts
        shell: powershell
        run: |
          foreach ($path in @("artifacts/agent-check", "artifacts/release-candidate", "artifacts/android-integration-probe")) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

      - name: Bootstrap portable Python
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap_portable_python.ps1

      - name: Verify Unity runner environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_unity_runner_environment.ps1

      - name: Run Unity agent gate
        if: ${{ env.AGENT_CHECK_MODE != 'AndroidIntegrationProbe' && env.AGENT_CHECK_MODE != 'DeviceSmokeApk' && env.AGENT_CHECK_MODE != 'DeviceCapture' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\agent_check.ps1 -Mode $env:AGENT_CHECK_MODE -SkipFast

      - name: Build signed device-smoke APK
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceSmokeApk' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_release_candidate_checks.ps1 -BuildSmokeApk

      - name: Run Android integration and native AAR probe
        if: ${{ env.AGENT_CHECK_MODE == 'AndroidIntegrationProbe' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_android_integration_probe.ps1 -TimeoutSeconds 2400

      - name: Capture connected Android screen
        if: ${{ env.AGENT_CHECK_MODE == 'DeviceCapture' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "artifacts\device-capture"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $adb = Get-Command adb -ErrorAction SilentlyContinue
          if ($adb) {
            $adbExe = $adb.Source
          } else {
            $unity = [Environment]::ExpandEnvironmentVariables($env:UNITY_EXE)
            if ([string]::IsNullOrWhiteSpace($unity) -or -not (Test-Path $unity)) {
              $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.24f1\Editor\Unity.exe"
            }
            $adbExe = Join-Path (Split-Path -Parent $unity) "Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe"
          }
          if (-not (Test-Path $adbExe)) { throw "adb not found: $adbExe" }

          $devices = @()
          foreach ($line in (& $adbExe devices)) {
            if ($line -match "^([^\s]+)\s+device\s*$") { $devices += $Matches[1] }
          }
          if ($devices.Count -ne 1) { throw "Expected exactly one authorized Android device; found $($devices.Count)." }
          $serial = $devices[0]

          $model = ((& $adbExe -s $serial shell getprop ro.product.model) | Out-String).Trim()
          $api = ((& $adbExe -s $serial shell getprop ro.build.version.sdk) | Out-String).Trim()
          $focused = ((& $adbExe -s $serial shell dumpsys window windows | Select-String -Pattern "mCurrentFocus|mFocusedApp" | Select-Object -First 4) | Out-String).Trim()

          & $adbExe -s $serial shell screencap -p /sdcard/nesbeisya-current.png
          & $adbExe -s $serial pull /sdcard/nesbeisya-current.png (Join-Path $out "current-screen.png") | Out-Host
          & $adbExe -s $serial shell monkey -p ru.release.nesbeisya -c android.intent.category.LAUNCHER 1 | Out-Host
          Start-Sleep -Seconds 3
          & $adbExe -s $serial shell screencap -p /sdcard/nesbeisya-app.png
          & $adbExe -s $serial pull /sdcard/nesbeisya-app.png (Join-Path $out "app-screen.png") | Out-Host
          & $adbExe -s $serial shell rm /sdcard/nesbeisya-current.png /sdcard/nesbeisya-app.png | Out-Null

          @(
            "DeviceCapture=PASS",
            "Serial=$serial",
            "Model=$model",
            "ApiLevel=$api",
            "FocusedBeforeCapture=$focused"
          ) | Set-Content -Path (Join-Path $out "capture-report.txt") -Encoding UTF8

      - name: Upload Unity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/agent-check/**
            artifacts/release-candidate/**
            artifacts/android-integration-probe/**
            artifacts/device-capture/**
