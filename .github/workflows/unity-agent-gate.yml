name: unity-agent-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: unity-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity:
    if: ${{ vars.UNITY_SELF_HOSTED_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, unity-agent]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unity compile, EditMode tests and serialized validation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\agent_check.ps1 -Mode Unity

      - name: Upload Unity agent diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-diagnostics-${{ github.run_id }}
          path: |
            artifacts/agent-check/**
            artifacts/release-candidate/**
          if-no-files-found: warn
          retention-days: 7
